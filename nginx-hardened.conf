# nginx-hardened.conf
# Secure Nginx configuration for TLS termination (Internet & Wireless topologies)

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Redirect all HTTP traffic to HTTPS
    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    # TLS Certificates (mounted via Docker secrets)
    ssl_certificate /run/secrets/tls_certificate.pem;
    ssl_certificate_key /run/secrets/tls_private_key.pem;

    # Strong TLS Protocols and Ciphers (Disable TLSv1.0 and TLSv1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # SSL Session Cache and Timeouts
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hide Nginx version
    server_tokens off;

    # Client body size limit
    client_max_body_size 2g;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://oscar:8282;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Prevent proxying to loopback or internal non-app addresses (SSRF mitigation)
        # Assuming internal DNS resolves 'oscar' to the correct container
    }
}